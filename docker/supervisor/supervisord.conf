; Base supervisor configuration. It deliberately declares NO programs.
;
; The entrypoint copies exactly one role file into /etc/supervisor/conf.d/
; before starting supervisord, and the include below picks up that one file.
; That is what makes CONTAINER_ROLE mean something.
;
; It did not used to. This file declared laravel-queue directly, and the
; Dockerfile copied every role config into conf.d/ at build time, so the include
; matched all of them and any role started every program: the queue workers, the
; scheduler, the Kafka consumer, the outbox processor and the nightwatch agent.
; Running four worker containers therefore ran FOUR Laravel schedulers, and every
; scheduled task fired four times.
;
; If you add a program here, it runs in every role. That is almost never what
; you want: put it in the role's own file instead.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[include]
files = /etc/supervisor/conf.d/*.conf
